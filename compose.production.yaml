name: vida-financeira

services:
  backend:
    image: vida-financeira-backend:current
    build:
      context: ./backend
    restart: unless-stopped
    user: "997:987"
    network_mode: host
    env_file:
      - ./backend/.env
    command: ["php", "artisan", "serve", "--host=127.0.0.1", "--port=8101", "--no-interaction"]
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./deploy/php/vida-financeira.ini:/usr/local/etc/php/conf.d/vida-financeira.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8101/up\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  scheduler:
    image: vida-financeira-backend:current
    build:
      context: ./backend
    restart: unless-stopped
    user: "997:987"
    network_mode: host
    env_file:
      - ./backend/.env
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: vida-financeira-frontend:current
    build:
      context: ./frontend
    restart: unless-stopped
    network_mode: host
    env_file:
      - /var/lib/vida-financeira/private/frontend.env
    environment:
      BACKEND_URL: http://127.0.0.1:8101
    command: ["node_modules/.bin/next", "start", "--hostname", "127.0.0.1", "--port", "3101"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3101/entrar\").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
